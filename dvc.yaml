# dvc.yaml

stages:
  generate_company_reference:
    cmd: python src/scrape_dow30_wikipedia.py
    deps:
      - src/scrape_dow30_wikipedia.py
    params:
      - generate_company_reference
    outs:
      - data/raw/scraped/dow30_companies.csv
      - data/raw/scraped/dow30_companies.json
      - data/raw/scraped/dow30_websites.json
      - data/raw/scraped/dow30_metadata.json
    desc: "Build reference list of Dow 30 companies"

  find_ir_pages:
    cmd: python src/find_ir_pages.py
    deps:
      - src/find_ir_pages.py
      - src/sec_edgar.py
      - data/raw/scraped/dow30_companies.csv
    params:
      - find_ir_pages
    outs:
      - data/processed/ir_pages/ir_pages.json
      - data/processed/ir_pages/ir_discovery_summary.json
    desc: "Find IR pages (automated discovery with EDGAR fallback)"

  find_earnings_reports:
    cmd: python src/find_earnings_reports.py
    deps:
      - src/find_earnings_reports.py
      - data/processed/ir_pages/ir_pages.json
    params:
      - find_earnings_reports
    outs:
      - data/processed/earnings_reports/earnings_reports_links.json
      - data/processed/earnings_reports/earnings_discovery_summary.json
    desc: "Find earnings reports from IR pages"

  download_reports:
    cmd: python src/download_reports.py
    deps:
      - src/download_reports.py
      - data/processed/earnings_reports/earnings_reports_links.json
    params:
      - download_reports
    outs:
      - data/raw/earnings_reports
    desc: "Download earnings reports"

  parse_reports:
    cmd: python src/parse_reports.py
    deps:
      - src/parse_reports.py
      - src/extract_pdf_text.py
      - src/hybrid_tables.py
      - src/layout_detection.py    
      - src/format_converter.py    
      - data/raw/earnings_reports
    params:
      - parse_reports
    outs:
      - data/processed/parsed_earnings
    desc: "Parse earnings reports (text, tables, images, layout, formats)"